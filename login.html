<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Login - Vault Custodial Services</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #111827;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border: 1px solid #1f2937;
        }
        .logo-text {
            font-size: 14px;
            letter-spacing: 1.5px;
            color: #3b82f6;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        h2 {
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #9ca3af;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #10b981;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #059669;
        }
        .support-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #9ca3af;
        }
        .support-link a {
            color: #3b82f6;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo-text">Vault Custodial Services</div>
    <h2>ETH Asset Portal</h2>
    
    <form action="dashboard.html">

        <div class="form-group">
            <label for="vault-id">Vault ID</label>
            <input type="text" id="vault-id" name="vault_id" placeholder="Vault ID" required>

        </div>
        
        <div class="form-group">
            <label for="email">Account Email</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Secure PIN / Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="login-btn">Access Secure Vault</button>
    </form>
    
    <div class="support-link">
        Need assistance? <a href="mailto:support@vaultcustodial.com">Contact Support</a>
    </div>
</div>

</body>
</html>
