<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Dashboard | Vault Custodial Services</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 15px;
      margin-bottom: 30px;
    }
    .header h2 {
      font-size: 18px;
      margin: 0;
      color: #9ca3af;
    }
    .logout-btn {
      background-color: transparent;
      border: 1px solid #1f2937;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    .logout-btn:hover {
      background-color: #1f2937;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .vault-info {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #9ca3af;
    }
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 24px;
    }
    .card h3 {
      color: #9ca3af;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .balance {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: #ffffff;
    }
    .usd-value {
      font-size: 16px;
      color: #9ca3af;
      margin: 0;
      font-weight: 500;
    }
    .withdraw-container {
      margin-bottom: 30px;
    }
    .withdraw-btn {
      background-color: #10b981;
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    .withdraw-btn:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Vault Custodial Services</h2>
      <a href="login.html" class="logout-btn">Log Out</a>
    </div>

    <div class="vault-info">
      Authenticated Vault ID: <span id="activeVaultId" style="color: #ffffff; font-weight: 600;">CK-7792</span> &nbsp;|&nbsp; Status: <span style="color: #10b981;">Secured & Active</span>
    </div>

    <div class="card-grid">
      <div class="card">
        <h3>Primary Portfolio</h3>
        <p class="balance">500 ETH</p>
        <p class="usd-value">$1,166,229.04 USD</p>
      </div>
      <div class="card">
        <h3>Secondary Portfolio</h3>
        <p class="balance">42.7357201 ETH</p>
        <p class="usd-value">$99,679.28 USD</p>
      </div>
    </div>

    <div class="withdraw-container">
      <button class="withdraw-btn" onclick="triggerWithdrawal()">Withdraw Funds</button>
    </div>
  </div>

  <script>
    function triggerWithdrawal() {
      alert("Notice: Early escrow transfer restricted under pre-launch contract structure. Please check your secure messaging channel for node compliance clearance parameters.");
    }
  </script>

</body>
</html>
