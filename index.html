<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Custodial Services | Institutional Asset Custody</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px 20px;
    }
    h1 {
      color: #ffffff;
      font-size: 28px;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #8b949e;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
    }
    p {
      color: #8b949e;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 30px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background-color: #238636;
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2ea043;
    }
    .btn-outline {
      background-color: transparent;
      border: 1px solid #30363d;
      color: #c9d1d9;
    }
    .btn-outline:hover {
      background-color: #30363d;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="subtitle">Institutional-Grade Custody</div>
    <h1>Vault Custodial Services</h1>
    <p>Uncompromising security, zero-knowledge architecture.</p>
    <div class="btn-group">
      <a href="login.html" class="btn">Client Portal Login</a>
      <a href="mailto:support@vaultcustodial.com" class="btn btn-outline">Contact Support</a>
    </div>
  </div>
</body>
</html>
